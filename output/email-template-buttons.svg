<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">
  <rect width="900" height="760" fill="#f4f6f9"/>
  <text x="450" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172033">Firebase email preview</text>

  <rect x="70" y="90" width="760" height="270" rx="18" fill="#ffffff" stroke="#dce2ea"/>
  <text x="110" y="135" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Reset your Medication Reminder password</text>
  <text x="110" y="181" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d4758">Hello Phong,</text>
  <text x="110" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d4758">We received a request to reset your account password.</text>
  <rect x="110" y="242" width="240" height="54" rx="10" fill="#356fe5"/>
  <text x="230" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Reset your password</text>
  <text x="110" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687386">If you did not request this, you can safely ignore this email.</text>

  <rect x="70" y="400" width="760" height="290" rx="18" fill="#ffffff" stroke="#dce2ea"/>
  <text x="110" y="445" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Verify your email for Medication Reminder</text>
  <text x="110" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d4758">Hello Phong,</text>
  <text x="110" y="525" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d4758">Please verify your email to finish setting up your account.</text>
  <rect x="110" y="552" width="270" height="54" rx="10" fill="#356fe5"/>
  <text x="245" y="586" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Verify your email address</text>
  <text x="110" y="640" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687386">If you did not create this account, you can safely ignore this email.</text>
  <text x="110" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687386">Medication Reminder team</text>
</svg>
